<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Mechabellum companion app for new players: find counters, get live match help, learn the units.">
  <title>Mechabellum Companion</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <header class="app-header">
    <h1><span class="accent">Mecha</span>Companion</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" role="tablist">
    <button class="tab active" data-tab="counter" role="tab">
      <span class="tab-icon">🎯</span><span class="tab-label">Counters</span>
    </button>
    <button class="tab" data-tab="live" role="tab">
      <span class="tab-icon">⚔️</span><span class="tab-label">Live Match</span>
    </button>
    <button class="tab" data-tab="units" role="tab">
      <span class="tab-icon">🤖</span><span class="tab-label">Units</span>
    </button>
    <button class="tab" data-tab="tips" role="tab">
      <span class="tab-icon">💡</span><span class="tab-label">Tips</span>
    </button>
  </nav>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-grab"></div>
      <button id="sheetClose" class="sheet-close" aria-label="Close">✕</button>
      <div id="sheetContent" class="sheet-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
